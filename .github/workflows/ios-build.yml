# Builds an UNSIGNED Downtime.ipa on a free macOS runner.
# Download the artifact, then install it with AltStore/Sideloadly (they sign it
# with your free Apple ID).
#
#   dev     -> development client; loads JS live from `npx expo start` on your PC
#   release -> JS bundled inside the app; works without your PC
name: iOS build (unsigned .ipa)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [dev, release]
        default: dev
      runner:
        description: macOS runner (switch if one pool is stuck in the queue)
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel
  push:
    tags: ['v*'] # tags build a release

jobs:
  build:
    # The Apple Silicon pool (macos-latest) can be too congested to pick up the
    # job at all; the Intel pool is slower but has separate capacity.
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ (github.event.inputs.variant || 'release') == 'dev' && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate native iOS project (also runs pod install)
        run: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Downtime.xcworkspace \
            -scheme Downtime \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/${CONFIGURATION}-iphoneos/Downtime.app" Payload/
          zip -qry "Downtime-${CONFIGURATION}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Downtime-${{ env.CONFIGURATION }}-ipa
          path: Downtime-${{ env.CONFIGURATION }}.ipa
          retention-days: 14
